<div class="p-6">
  <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-6">
    <div class="mb-6 border-b pb-4">
      <h1 class="text-2xl font-bold text-gray-800">Datensicherung</h1>
      <p class="text-sm text-gray-500 mt-1">
        Erstellen Sie eine vollständige Sicherung Ihrer Datenbank. Der Datenbestand wird im JSON-Format in einer .slowen-Datei gespeichert.
      </p>
    </div>

    @if (successMessage) {
      <div class="mb-6 p-4 bg-green-50 border border-green-400 text-green-800 rounded-md">
        <div class="flex items-center font-medium">
          <svg class="w-5 h-5 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          {{ successMessage }}
        </div>
        @if (savedFilePath) {
          <div class="mt-2 text-xs text-green-700 font-mono break-all bg-green-100/60 p-2 rounded border border-green-200">
            {{ savedFilePath }}
          </div>
        }
      </div>
    }

    @if (errorMessage) {
      <div class="mb-6 p-4 bg-red-50 border border-red-400 text-red-700 rounded-md text-sm">
        {{ errorMessage }}
      </div>
    }

    <div class="pt-2">
      <button
        type="button"
        (click)="createBackup()"
        [disabled]="isCreating"
        class="inline-flex items-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md shadow-sm transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (isCreating) {
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Sicherung wird erstellt...
        } @else {
          Neues Backup erstellen
        }
      </button>
    </div>
  </div>
</div>
